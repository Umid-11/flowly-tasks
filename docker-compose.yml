services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flowly-api
    ports:
      - "5064:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=JiraDb;Username=postgres;Password=Umid1234."
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: flowly-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: JiraDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Umid1234.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  frontend:
    build:
      context: ./frontend
      dockerfile: src/Dockerfile
    container_name: flowly-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data: